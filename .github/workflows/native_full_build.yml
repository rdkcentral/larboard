name: Build Component in Native Environment

on:
  push:
    branches: [ main, 'sprint/**', 'release/**', develop , 'feature/coverity-integration' ]
  pull_request:
    branches: [ main, 'sprint/**', 'release/**', 'topic/*', develop ]

jobs:
  build-larboard-on-pr:
    name: Build larboard component in github rdkcentral
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rdkcentral/docker-rdk-ci:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check native build environment
        run: |
          echo "Checking native build tools..."
          cat /etc/os-release
          command -v cmake || true
          command -v ninja || true
          command -v pkg-config || true
          command -v c++ || true
          git --version

      - name: Check Coverity tools
        run: |
          for tool in cov-build cov-capture cov-analyze cov-format-errors; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: found"
              "$tool" --version || true
            else
              echo "$tool: not found"
            fi
          done

      - name: native build
        run: |
          bash -x cov_build.sh
