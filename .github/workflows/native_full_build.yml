name: Build Larboard using Yocto SDK

on:
  push:
    branches:
      - main
      - 'sprint/**'
      - 'release/**'
      - develop
      - 'feature/coverity-integration'

  pull_request:
    branches:
      - main
      - 'sprint/**'
      - 'release/**'
      - 'topic/*'
      - develop

jobs:
  build-larboard:
    name: Build Larboard component using Yocto SDK
    runs-on: ubuntu-latest

    container:
      image: ghcr.io/rdkcentral/docker-rdk-ci:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check build environment
        run: |
          echo "Checking build environment..."
          cat /etc/os-release

          for tool in git curl python3 make gcc g++ tar; do
            command -v "$tool" || exit 1
          done

          git --version
          python3 --version

      - name: Verify Yocto SDK
        run: |
          SDK_DIR="oecore-x86_64"

          test -f "$SDK_DIR/environment-setup-armv7at2hf-neon-oe-linux-gnueabi"
          test -d "$SDK_DIR/sysroots/armv7at2hf-neon-oe-linux-gnueabi"
          test -d "$SDK_DIR/sysroots/x86_64-bolt_distro-linux"

          du -sh "$SDK_DIR"

      - name: Check Coverity tools
        run: |
          for tool in cov-build cov-capture cov-analyze cov-format-errors; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: found"
              "$tool" --version || true
            else
              echo "$tool: not found"
            fi
          done

      - name: Build Larboard
        run: |
          bash cov_build.sh

      - name: Verify build output
        run: |
          OUTPUT="cobalt-build/src/out/rdk-arm_gold/starboard/obj/third_party/starboard/rdk/shared/libstarboard_platform.a"

          test -f "$OUTPUT"
          ls -lh "$OUTPUT"
          echo "Larboard build completed successfully."
